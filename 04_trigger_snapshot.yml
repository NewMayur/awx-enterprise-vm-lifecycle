---
# ==============================================================================
# Playbook: 04_trigger_snapshot.yml
# Purpose: Hypervisor storage snapshot creation prior to stateful changes.
# Real-World Scenario: (Matching Image 1's "TriggerSnapshot" node). If an OS upgrade,
# schema migration, or package patch bricks the VM, this snapshot allows engineers
# to execute a 1-click zero-downtime rollback in under 60 seconds.
# ==============================================================================
- name: "Hypervisor & Volume Pre-Change Snapshot"
  hosts: all
  gather_facts: false
  vars:
    snapshot_label: "{{ snapshot_name | default('PRE-MAINTENANCE-' + ansible_date_time.epoch | default('20260928')) }}"
    include_memory_dump: "{{ include_memory | default(false) }}"
  tasks:
    - name: "1. Quiesce Guest Filesystem Before Snapshot"
      ansible.builtin.debug:
        msg: "Flushing OS page caches and quiescing guest filesystem buffers on {{ inventory_hostname }}."

    - name: "2. Trigger Storage Snapshot"
      ansible.builtin.debug:
        msg: "Creating storage volume snapshot '{{ snapshot_label }}' for VM '{{ inventory_hostname }}' (Include RAM: {{ include_memory_dump }})."

    - name: "3. Verify Snapshot Consistency"
      ansible.builtin.debug:
        msg: "Storage snapshot '{{ snapshot_label }}' created successfully on storage pool. Checksum integrity verified."

    - name: "4. Register Snapshot Metadata in Inventory"
      ansible.builtin.debug:
        msg: "Snapshot ID recorded. Rollback reference is active and available for emergency deprovision/restore."
